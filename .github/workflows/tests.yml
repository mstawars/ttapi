name: Tests

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:

# Allow deployments to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep only one active deployment per ref; cancel any in-progress run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      # ── Database ─────────────────────────────────────────────────────────────
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: false

      # ── Keycloak ──────────────────────────────────────────────────────────────
      KC_BASE_URL: http://localhost:8180
      KC_REALM: ttapi
      KC_CLIENT_ID: ttapi-client
      KC_DEFAULT_PASSWORD: ${{ secrets.KC_DEFAULT_PASSWORD }}

      # ── Tenant credentials ────────────────────────────────────────────────────
      TENANT_ALPHA_USERNAME: ${{ secrets.TENANT_ALPHA_USERNAME }}
      TENANT_ALPHA_PASSWORD: ${{ secrets.TENANT_ALPHA_PASSWORD }}
      TENANT_BETA_USERNAME: ${{ secrets.TENANT_BETA_USERNAME }}
      TENANT_BETA_PASSWORD: ${{ secrets.TENANT_BETA_PASSWORD }}
      TENANT_GAMMA_USERNAME: ${{ secrets.TENANT_GAMMA_USERNAME }}
      TENANT_GAMMA_PASSWORD: ${{ secrets.TENANT_GAMMA_PASSWORD }}

      # ── Frontend & API ────────────────────────────────────────────────────────
      FRONTEND_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8080

    steps:
      # ── Checkout test repository ─────────────────────────────────────────────
      - name: Checkout test repository (ttapi - this repo)
        uses: actions/checkout@v5
        with:
          path: ttapi-tests

      # ── Checkout application repository (private) ────────────────────────────
      - name: Checkout application repository (ttapi_app - private)
        id: checkout_app
        uses: actions/checkout@v5
        with:
          repository: mstawars/ttapi_app
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ttapi-app

      # ── Build & start the full stack via Docker Compose ───────────────────────
      - name: Build and start services
        if: steps.checkout_app.outcome == 'success'
        working-directory: ttapi-app
        run: docker compose -f docker/docker-compose.yaml up -d --build --wait
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ttapi-tests/tests/package-lock.json

      - name: Install test dependencies
        working-directory: ttapi-tests/tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ttapi-tests/tests
        run: npx playwright install --with-deps chromium

      # ── API tests ─────────────────────────────────────────────────────────────
      - name: Run API tests
        id: api_tests
        working-directory: ttapi-tests/tests
        run: npx playwright test --project=api
        continue-on-error: true

      # ── E2E tests ─────────────────────────────────────────────────────────────
      - name: Run E2E tests
        id: e2e_tests
        working-directory: ttapi-tests/tests
        run: npx playwright test --project=e2e
        continue-on-error: true

      # ── Generate Allure report ────────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        working-directory: ttapi-tests/tests
        run: |
          npm install -g allure-commandline --quiet
          allure generate allure-results --clean -o allure-report

      # ── Upload raw results for debugging ──────────────────────────────────────
      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: ttapi-tests/tests/allure-results/
          retention-days: 7

      # ── Upload report as Pages artifact ───────────────────────────────────────
      - name: Upload Allure report for GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: ttapi-tests/tests/allure-report/

      # ── Tear down ─────────────────────────────────────────────────────────────
      - name: Stop services
        if: always() && steps.checkout_app.outcome == 'success'
        working-directory: ttapi-app
        run: docker compose -f docker/docker-compose.yaml down -v

      # ── Warning-only gate: always publish report, never fail job here ───────
      - name: Warn when tests failed
        if: always()
        run: |
          echo "API tests outcome: ${{ steps.api_tests.outcome }}"
          echo "E2E tests outcome: ${{ steps.e2e_tests.outcome }}"

          if [ "${{ steps.api_tests.outcome }}" = "failure" ] || [ "${{ steps.e2e_tests.outcome }}" = "failure" ]; then
            echo "::warning::One or more test projects failed (API=${{ steps.api_tests.outcome }}, E2E=${{ steps.e2e_tests.outcome }})."
            echo "### ⚠️ Test warning" >> "$GITHUB_STEP_SUMMARY"
            echo "- API: ${{ steps.api_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- E2E: ${{ steps.e2e_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Test status" >> "$GITHUB_STEP_SUMMARY"
            echo "- API: ${{ steps.api_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- E2E: ${{ steps.e2e_tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Deploy report to GitHub Pages ─────────────────────────────────────────────
  deploy-report:
    name: Deploy Allure report to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
